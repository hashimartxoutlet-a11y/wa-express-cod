          const link = document.createElement("link");
          link.rel = "icon";
          link.href = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>${encodeURIComponent(b.emojiFavicon)}</text></svg>`;
          document.head.appendChild(link);
        }
        el("brandFooter").textContent = b.footerText || "";
      } else if (b.mode === "poweredBy") {
        document.title = `${st.brand} · Express COD`;
        el("brandFooter").textContent = `Powered by ${CONFIG.BRAND_NAME}`;
      } else {
        document.title = `${st.brand} · Express COD`;
        el("brandFooter").textContent = "";
      }
    }

    function populateCities(country, filterText = "") {
      const list = country === "PK" ? PK_CITIES : (GCC_CITIES[country] || PK_CITIES);
      const q = filterText.trim().toLowerCase();
      const curVal = el("custCity").value;
      const sel = el("custCity");
      sel.innerHTML = "";
      const filtered = q ? list.filter(([c]) => c.toLowerCase().includes(q)) : list;
      for (const [city, prov] of filtered) {
        const opt = document.createElement("option");
        opt.value = city;
        opt.textContent = `${city} (${prov})`;
        sel.appendChild(opt);
      }
      if (curVal && filtered.some(([c]) => c === curVal)) sel.value = curVal;
    }

    function validatePhoneInput() {
      const country = state.store?.country || "PK";
      const raw = el("custPhone").value.replace(/[\s\-()+]/g, "");
      if (!raw) return { ok: false, msg: PHONE_META[country]?.hint || "" };
      if (country === "PK") {
        let local = raw;
        if (local.startsWith("92")) local = "0" + local.slice(2);
        else if (local.startsWith("3") && local.length === 10) local = "0" + local;
        if (!/^03\d{9}$/.test(local) || local === "03000000000" || local === "03123456789" || /^03(\d)\1{8}$/.test(local)) {
          return { ok: false, msg: "Enter valid 03XXXXXXXXX mobile number" };
        }
        return { ok: true, normalized: local };
      }
      if (country === "AE" || country === "SA") {
        const cc = country === "AE" ? "971" : "966";
        let local = raw;
        if (local.startsWith(cc)) local = "0" + local.slice(3);
        else if (local.startsWith("5") && local.length === 9) local = "0" + local;
        if (!/^05\d{8}$/.test(local)) return { ok: false, msg: PHONE_META[country].hint };
        return { ok: true, normalized: local };
      }
      const ccMap = { QA:"974", KW:"965", BH:"973", OM:"968" };
      const reMap = { QA:/^[3567]\d{7}$/, KW:/^[569]\d{7}$/, BH:/^[36]\d{7}$/, OM:/^[79]\d{7}$/ };
      let local = raw;
      if (local.startsWith(ccMap[country])) local = local.slice(3);
      if (!reMap[country].test(local)) return { ok: false, msg: PHONE_META[country].hint };
      return { ok: true, normalized: local };
    }

    function computeBill() {
      const st = state.store, v = state.selectedVariant;
      if (!st || !v) return;
      const cur = st.currency || "PKR";
      const unitMinor = toMinor(v.price);
      const totalQty = state.qty + (state.upsell ? 1 : 0);
      const subtotalMinor = unitMinor * totalQty;

      const u = st.upsell || {};
      let discPerExtra = 0;
      if (u.enabled !== false) {
        const ov = (u.overrides && state.selectedProduct && u.overrides[state.selectedProduct.handle]) || null;
        const type = (ov && ov.type) || u.type || "percent";
        const val = Number((ov && ov.value !== undefined ? ov.value : u.value) ?? 10);
        discPerExtra = type === "fixed" ? Math.min(unitMinor, Math.round(val * 100)) : Math.round((unitMinor * val) / 100);
      }
      const discountMinor = state.upsell ? discPerExtra : 0;

      if (u.enabled !== false && discPerExtra > 0) {
        el("upsellCard").classList.remove("hidden");
        el("upsellTitle").textContent = `Add 1 Extra Piece & Save ${fmt(discPerExtra, cur)}`;
      } else {
        el("upsellCard").classList.add("hidden");
        state.upsell = false;
        el("upsellToggle").checked = false;
      }

      const del = st.delivery || {};
      const city = el("custCity").value;
      let deliveryMinor = Math.round((Number(del.baseFee) || 0) * 100);
      if (del.mode === "rules") {
        if (del.cityFees && del.cityFees[city] !== undefined) deliveryMinor = Math.round(Number(del.cityFees[city]) * 100);
        deliveryMinor += Math.round((Number(del.codFee) || 0) * 100);
        const freeAboveMinor = Math.round((Number(del.freeAbove) || 0) * 100);
        if (freeAboveMinor > 0) {
          if (subtotalMinor - discountMinor >= freeAboveMinor) {
            deliveryMinor = 0;
            el("freeShipHint").classList.add("hidden");
          } else {
            el("freeShipHint").textContent = `Add ${fmt(freeAboveMinor - (subtotalMinor - discountMinor), cur)} more for free delivery`;
            el("freeShipHint").classList.remove("hidden");
          }
        } else el("freeShipHint").classList.add("hidden");
      } else el("freeShipHint").classList.add("hidden");

      const totalMinor = subtotalMinor - discountMinor + deliveryMinor;
      el("billSubtotal").textContent = fmt(subtotalMinor, cur);
      el("billDiscRow").classList.toggle("hidden", discountMinor <= 0);
      el("billDiscount").textContent = `-${fmt(discountMinor, cur)}`;
      el("billDelivery").textContent = deliveryMinor === 0 ? "FREE" : fmt(deliveryMinor, cur);
      el("billTotal").textContent = fmt(totalMinor, cur);
      el("stickyTotal").textContent = fmt(totalMinor, cur);
    }

    function renderProduct(prod) {
      state.selectedProduct = prod;
      if (!prod) return;
      el("prodTitle").textContent = prod.title;
      const vs = el("variantSelect");
      vs.innerHTML = "";
      const cur = state.store?.currency || "PKR";
      let firstAvail = null;
      for (const v of prod.variants) {
        const opt = document.createElement("option");
        opt.value = v.id;
        const soldOut = !v.availableForSale || (v.inventoryPolicy !== "CONTINUE" && v.inventoryQuantity !== null && v.inventoryQuantity <= 0);
        opt.textContent = `${v.title} - ${fmt(toMinor(v.price), cur)}${soldOut ? " (Sold Out)" : ""}`;
        opt.disabled = soldOut;
        if (!soldOut && !firstAvail) firstAvail = v;
        vs.appendChild(opt);
      }
      state.selectedVariant = firstAvail || prod.variants[0] || null;
      if (state.selectedVariant) {
        vs.value = state.selectedVariant.id;
        el("prodPrice").textContent = fmt(toMinor(state.selectedVariant.price), cur);
        el("prodImg").src = imgWithWidth(state.selectedVariant.image || prod.image);
      }
      computeBill();
    }

    function renderProductDropdown(q = "") {
      const sel = el("prodSelect");
      sel.innerHTML = "";
      const list = q ? state.products.filter((p) => p.title.toLowerCase().includes(q.toLowerCase())) : state.products;
      for (const p of list) {
        const opt = document.createElement("option");
        opt.value = p.handle;
        opt.textContent = p.title;
        sel.appendChild(opt);
      }
      if (list.length) {
        if (state.selectedProduct && list.some((p) => p.handle === state.selectedProduct.handle)) sel.value = state.selectedProduct.handle;
        else renderProduct(list[0]);
      }
    }

    async function loadCatalog() {
      el("stateView").classList.add("hidden");
      el("skeletonView").classList.remove("hidden");
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 8000);
      try {
        const url = `${CONFIG.API_BASE}/api/catalog?store=${encodeURIComponent(storeSlug)}&product=${encodeURIComponent(initialProductHandle)}`;
        const res = await fetch(url, { signal: ctrl.signal });
        clearTimeout(timer);
        const data = await res.json();
        if (!res.ok || !data.ok) {
          if (res.status === 404) return showState("🔍", "Store Not Found", data.message || "Please check your link.", false);
          if (res.status === 403) return showState("⏸️", "Store Paused", data.message || "This store is temporarily unavailable.", false);
          return showState("⚠️", "Could Not Load Store", data.message || "Please try again.", true);
        }
        state.store = data.store;
        state.products = data.products || [];
        if (!state.products.length) return showState("📦", "No Active Products", "This store currently has no available items.", false);

        applyBranding(state.store);
        el("modeBanner").classList.toggle("hidden", state.store.mode !== "whatsapp_only");
        const pm = PHONE_META[state.store.country] || PHONE_META.PK;
        el("custPhone").placeholder = pm.placeholder;
        el("phoneHint").textContent = pm.hint;
        populateCities(state.store.country);

        const pre = initialProductHandle && state.products.find((p) => p.handle === initialProductHandle);
        if (pre) {
          el("productPickerWrap").classList.add("hidden");
          el("changeProdBtn").classList.remove("hidden");
          renderProduct(pre);
        } else {
          el("productPickerWrap").classList.remove("hidden");
          el("changeProdBtn").classList.add("hidden");
          renderProductDropdown();
        }

        if (CONFIG.TURNSTILE_SITE_KEY && window.turnstile && !el("turnstileBox").hasChildNodes()) {
          window.turnstile.render("#turnstileBox", { sitekey: CONFIG.TURNSTILE_SITE_KEY, callback: (t) => { state.turnstileToken = t; } });
        }
        el("skeletonView").classList.add("hidden");
        el("orderForm").classList.remove("hidden");
        el("stickyBar").classList.remove("hidden");
        state.loadedAt = Date.now();
      } catch (e) {
        clearTimeout(timer);
        showState("📡", "Connection Timeout", "Network is slow or unavailable. Please tap Retry.", true);
      }
    }

    el("retryBtn").addEventListener("click", loadCatalog);
    el("changeProdBtn").addEventListener("click", () => { el("productPickerWrap").classList.remove("hidden"); el("changeProdBtn").classList.add("hidden"); renderProductDropdown(); });
    el("prodSearch").addEventListener("input", (e) => renderProductDropdown(e.target.value));
    el("prodSelect").addEventListener("change", (e) => { const p = state.products.find((x) => x.handle === e.target.value); if (p) renderProduct(p); });
    el("variantSelect").addEventListener("change", (e) => {
      const v = state.selectedProduct?.variants.find((x) => x.id === e.target.value);
      if (v) { state.selectedVariant = v; el("prodPrice").textContent = fmt(toMinor(v.price), state.store.currency); if (v.image) el("prodImg").src = imgWithWidth(v.image); computeBill(); }
    });
    el("qtyMinus").addEventListener("click", () => { if (state.qty > 1) { state.qty--; el("qtyVal").textContent = state.qty; computeBill(); } });
    el("qtyPlus").addEventListener("click", () => { const maxQ = state.store?.maxQty || 5; if (state.qty < maxQ) { state.qty++; el("qtyVal").textContent = state.qty; computeBill(); } });
    el("upsellToggle").addEventListener("change", (e) => { state.upsell = e.target.checked; computeBill(); });
    el("citySearch").addEventListener("input", (e) => { populateCities(state.store?.country || "PK", e.target.value); computeBill(); });
    el("custCity").addEventListener("change", computeBill);
    el("custPhone").addEventListener("input", () => {
      const r = validatePhoneInput();
      el("phoneHint").textContent = r.ok ? `✓ ${r.normalized}` : r.msg;
      el("phoneHint").className = `text-xs mt-1 ${r.ok ? "text-emerald-700 font-semibold" : "text-slate-500"}`;
    });

    async function submitOrder() {
      if (state.submitting) return;
      el("formError").classList.add("hidden");
      const name = el("custName").value.trim(), addr = el("custAddress").value.trim(), phoneV = validatePhoneInput();
      if (name.length < 2) return showFormErr("Please enter your full name (at least 2 characters).");
      if (!phoneV.ok) return showFormErr(phoneV.msg || "Please enter a valid phone number.");
      if (!el("custCity").value) return showFormErr("Please select your city.");
      if (addr.length < 10) return showFormErr("Please enter your complete delivery address (at least 10 characters).");
      if (!state.selectedVariant) return showFormErr("Please choose an available product option.");

      state.submitting = true; el("submitBtn").disabled = true; el("submitSpinner").classList.remove("hidden");
      try {
        const res = await fetch(`${CONFIG.API_BASE}/api/order`, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=UTF-8" },
          body: JSON.stringify({
            store: storeSlug, variantId: state.selectedVariant.id, productHandle: state.selectedProduct?.handle || "",
            productTitle: state.selectedProduct?.title || "", variantTitle: state.selectedVariant?.title || "",
            clientUnitPrice: state.selectedVariant?.price || "0", qty: state.qty, upsell: state.upsell,
            name, phone: phoneV.normalized, city: el("custCity").value, address: addr, note: el("custNote").value.trim(),
            src: srcTag, hp: el("hpField").value, elapsedMs: Date.now() - state.loadedAt, turnstileToken: state.turnstileToken
          })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          if (res.status === 409 && data.code === "OUT_OF_STOCK" && state.selectedVariant) {
            state.selectedVariant.inventoryQuantity = data.availableQuantity ?? 0;
            if (data.availableQuantity === 0) state.selectedVariant.availableForSale = false;
            renderProduct(state.selectedProduct);
          }
          showFormErr(data.waUrl ? `${data.message} You can still message the seller on WhatsApp.` : (data.message || "Could not submit order."));
          return;
        }
        el("orderForm").classList.add("hidden"); el("stickyBar").classList.add("hidden");
        el("successOrderNum").textContent = data.orderName ? `Order ${data.orderName}` : "WhatsApp Confirmation Ready";
        el("successSub").textContent = data.mode === "shopify" ? "Your order is recorded. Opening WhatsApp to confirm..." : "Your order details will be confirmed directly on WhatsApp.";
        el("openWaBtn").href = data.waUrl;
        el("successView").classList.remove("hidden");
        setTimeout(() => { location.href = data.waUrl; }, 1500);
      } catch (e) {
        showFormErr("Network error while placing order. Please check your connection and try again.");
      } finally {
        state.submitting = false; el("submitBtn").disabled = false; el("submitSpinner").classList.add("hidden");
      }
    }

    function showFormErr(msg) {
      el("formError").textContent = msg;
      el("formError").classList.remove("hidden");
      el("formError").scrollIntoView({ behavior: "smooth", block: "center" });
    }

    el("submitBtn").addEventListener("click", submitOrder);
    if (CONFIG.TURNSTILE_SITE_KEY) {
      const s = document.createElement("script"); s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js"; s.async = true; document.head.appendChild(s);
    }
    applyLang();
    loadCatalog();
  </script>
</body>
